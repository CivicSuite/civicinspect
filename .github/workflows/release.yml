name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run release gate
        run: bash scripts/verify-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "civicinspect ${GITHUB_REF_NAME}" \
            --notes "CivicInspect ${GITHUB_REF_NAME} narrow truth-repair release. No functional upgrade. Supersedes the false v1.0.0 Latest impression." \
            "dist/civicinspect-${VERSION}-py3-none-any.whl" \
            "dist/civicinspect-${VERSION}.tar.gz" \
            dist/SHA256SUMS.txt
